<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="한글 문장을 따라 쓰며 속도와 정확도를 확인하는 타자 연습 게임">
  <title>소곤소곤 타자방</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">ㅎ</div>
      <div>
        <p class="eyebrow">KOREAN TYPING PRACTICE</p>
        <h1>소곤소곤 타자방</h1>
        <p class="subtitle">천천히, 정확하게. 오늘의 문장을 완성해 보세요.</p>
      </div>
    </header>

    <section class="game-card" aria-labelledby="sentence-label">
      <div class="card-topline">
        <span id="sentence-label" class="section-label">오늘의 문장</span>
        <span class="sentence-count"><b id="current-number">1</b> / 10</span>
      </div>

      <p id="target-sentence" class="target-sentence" aria-live="polite"></p>

      <label class="input-label" for="typing-input">아래에 문장을 입력하세요</label>
      <div class="input-wrap">
        <textarea
          id="typing-input"
          rows="3"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="첫 글자를 입력하면 시간이 시작돼요"
          aria-describedby="input-help"
        ></textarea>
        <span id="match-indicator" class="match-indicator" aria-hidden="true">✓</span>
      </div>
      <p id="input-help" class="input-help">문항마다 1분이 주어집니다. 완료하거나 건너뛰려면 Enter를 누르세요.</p>

      <div class="live-stats" aria-label="현재 기록">
        <div class="stat-box">
          <span class="stat-icon" aria-hidden="true">◷</span>
          <span class="stat-label">남은 시간</span>
          <strong id="live-time">1:00</strong>
        </div>
        <div class="stat-box">
          <span class="stat-icon" aria-hidden="true">⌨</span>
          <span class="stat-label">현재 타수</span>
          <strong id="live-cpm">0 CPM</strong>
        </div>
        <div class="stat-box">
          <span class="stat-icon" aria-hidden="true">◎</span>
          <span class="stat-label">정확도</span>
          <strong id="live-accuracy">100%</strong>
        </div>
      </div>
    </section>

    <section id="result-card" class="result-card" aria-labelledby="result-title" hidden>
      <div class="result-heading">
        <div class="celebration" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">COMPLETE</p>
          <h2 id="result-title">10문항 연습을 마쳤어요!</h2>
        </div>
      </div>
      <div class="result-grid">
        <div><span>걸린 시간</span><strong id="result-time">0.0초</strong></div>
        <div><span>분당 타수</span><strong id="result-cpm">0 CPM</strong></div>
        <div><span>정확도</span><strong id="result-accuracy">100%</strong></div>
      </div>
      <button id="retry-button" class="retry-button" type="button">다시하기 <span aria-hidden="true">↻</span></button>
    </section>

    <section class="history-section" aria-labelledby="history-title">
      <div class="history-heading">
        <div>
          <p class="eyebrow">MY RECORDS</p>
          <h2 id="history-title">최근 기록</h2>
        </div>
        <span class="history-note">최근 5개까지 저장돼요</span>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <template id="history-item-template">
    <article class="history-item">
      <span class="history-rank"></span>
      <div class="history-main">
        <p class="history-sentence"></p>
        <time class="history-date"></time>
      </div>
      <dl class="history-metrics">
        <div><dt>시간</dt><dd class="history-time"></dd></div>
        <div><dt>타수</dt><dd class="history-cpm"></dd></div>
        <div><dt>정확도</dt><dd class="history-accuracy"></dd></div>
      </dl>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
